<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WedgeLab Coaching Dashboard</title>
<meta name="description" content="WedgeLab builds your personal wedge yardages for every club and swing, adjusted for today's temperature and elevation.">
<meta name="theme-color" content="#041E42">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta property="og:type" content="website"><meta property="og:site_name" content="WedgeLab"><meta property="og:title" content="WedgeLab Coaching Dashboard"><meta property="og:description" content="WedgeLab builds your personal wedge yardages for every club and swing, adjusted for today's temperature and elevation.">
<meta property="og:url" content="https://wedgelab.app/coach.html"><meta property="og:image" content="https://wedgelab.app/img/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://wedgelab.app/img/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* WedgeLab site. Navy + white, gold only for marks and the one main button. Archivo everywhere, like the app. */
:root{
  --navy:#041E42; --navy2:#0A2A57; --blue:#1E407C; --gold:#C9A44C; --gold-ink:#8A6A1F;
  --bg:#FFFFFF; --paper:#F6F8FB; --panel:#F1F4F9; --ink:#0B1A33; --muted:#55657C; --line:#DDE3EC;
  --on-navy:#FFFFFF; --on-navy-muted:#B9C8E2; --link:#1E407C;
  --hi:#2F7A4A; --mid:#9A6200; --lo:#B42318;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:18px; --shadow:0 1px 2px rgba(4,30,66,.06),0 8px 24px rgba(4,30,66,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050F20;--paper:#071429;--panel:#0C1A30;--ink:#EEF2F8;--muted:#9AA8BD;--line:#22324D;--navy:#071A3A;--navy2:#0C2550;--link:#8FB1E8;--hi:#7CCB97;--mid:#F2C14E;--lo:#F28B82;--gold-ink:#D9B45E;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#050F20;--paper:#071429;--panel:#0C1A30;--ink:#EEF2F8;--muted:#9AA8BD;--line:#22324D;--navy:#071A3A;--navy2:#0C2550;--link:#8FB1E8;--hi:#7CCB97;--mid:#F2C14E;--lo:#F28B82;--gold-ink:#D9B45E;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--link);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px}
.i{flex:none}

/* Top bar: stays pinned while you scroll */
.bar{position:sticky;top:0;z-index:50;background:rgba(4,30,66,.92);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid rgba(255,255,255,.08)}
.bar .wrap{display:flex;align-items:center;gap:16px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand .wm{height:30px;width:auto;display:block}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{color:var(--on-navy-muted);text-decoration:none;font-weight:600;font-size:15px;padding:8px 12px;border-radius:10px}
.nav a:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav a[aria-current]{color:#fff}
.bar .btn{min-height:42px;padding:0 16px;font-size:15px;white-space:nowrap}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:12px;background:var(--gold);color:#041E42;font:inherit;font-weight:800;text-decoration:none;border:0;cursor:pointer;box-shadow:0 6px 18px rgba(201,164,76,.32);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(201,164,76,.38)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--muted)}
.dark .btn.ghost,.hero .btn.ghost{color:#fff;border-color:rgba(255,255,255,.3)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.link{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-decoration:none}
.link:hover{text-decoration:underline}

/* Hero */
.hero{position:relative;z-index:1;background:radial-gradient(900px 500px at 85% 20%,rgba(201,164,76,.16),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(30,64,124,.55),transparent 60%),var(--navy);color:#fff}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding-block:72px 0}
.hero .wrap>*{min-width:0}
.kicker{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.display{font-weight:800;font-size:clamp(68px,11vw,136px);line-height:.88;letter-spacing:-.045em;margin:14px 0 0}
.display span{display:block;color:var(--gold);font-size:.4em;letter-spacing:-.015em;margin-top:10px}
.hero .lede{color:var(--on-navy-muted);font-size:20px;line-height:1.5;max-width:30ch;margin:24px 0 28px}
.hero-copy{padding-bottom:72px}
.soon{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 20px;border-radius:12px;border:1.5px solid var(--gold);color:#fff;font-weight:700}
.soon .i{color:var(--gold)}
.signup{display:flex;gap:10px;max-width:460px;flex-wrap:wrap}
.signup input{flex:1 1 220px;min-width:0;min-height:52px;border-radius:12px;border:1.5px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:#fff;font:inherit;padding:0 16px}
.signup input::placeholder{color:#8EA3C4}
.signup input:focus{outline:2px solid var(--gold);border-color:transparent}
.signup-note{font-size:14px;color:var(--on-navy-muted);margin:12px 0 0;min-height:22px}
.signup-note.ok{color:#9FE0B5;font-weight:700}.signup-note.err{color:#FFC9BE;font-weight:700}
.hero-phone{display:flex;justify-content:center;align-self:end}
.hero-phone .phone{margin-bottom:-120px}

/* Phone frame around real app screens */
.phone{width:min(300px,78vw);border-radius:48px;padding:11px;background:linear-gradient(145deg,#2A3346,#0B1220 40%,#1C2433);box-shadow:0 40px 80px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.06) inset;position:relative}
.screen{border-radius:38px;overflow:hidden;background:#F6F8FB;position:relative}
.screen .status{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-size:13px;font-weight:700;color:#0B1A33;background:#F6F8FB}
.screen .island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:92px;height:26px;border-radius:20px;background:#05070C}
.screen .bars{display:flex;gap:4px;align-items:center}
.screen .bars i{display:block;width:16px;height:9px;border-radius:2.5px;border:1.5px solid #0B1A33;position:relative}
.screen .bars i::after{content:"";position:absolute;inset:1px;right:4px;background:#0B1A33;border-radius:1px}
.screen img,.screen video{width:100%;height:auto;display:block}

/* Sections */
section.s{padding-block:96px}
section.s.alt{background:var(--paper)}
.head{max-width:680px;margin:0 auto 52px;text-align:center}
h2{font-weight:800;font-size:clamp(30px,4.2vw,44px);line-height:1.08;letter-spacing:-.025em;margin:10px 0 14px;text-wrap:balance}
h3{font-weight:800;font-size:20px;line-height:1.25;margin:0 0 6px;letter-spacing:-.01em}
.muted{color:var(--muted)}
.lead{font-size:19px;color:var(--muted);line-height:1.55}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.step{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:var(--shadow);min-width:0}
.badge-i{width:48px;height:48px;border-radius:14px;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.step .n{font-size:13px;font-weight:800;color:var(--gold-ink);letter-spacing:.1em;margin-bottom:4px}

.feature{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.story{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.story p{font-size:18px;line-height:1.6;color:var(--ink);margin:0 0 16px}
.story .sig{font-weight:800;margin-top:22px}.story .sig span{display:block;font-weight:500;color:var(--muted);font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:26px 0 0}
.stats div{border:1px solid var(--line);border-radius:14px;padding:16px 14px;background:var(--paper)}
.stats b{display:block;font-size:30px;line-height:1;color:var(--ink);letter-spacing:-.02em}.stats span{display:block;margin-top:8px;font-size:14px;color:var(--muted);line-height:1.35}
.sheet{margin:0}.sheet a{display:block;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:#fff}
.sheet img{display:block;width:100%;height:auto}.sheet figcaption{font-size:14px;color:var(--muted);margin-top:12px;line-height:1.45}
@media (max-width:900px){.story{grid-template-columns:1fr;gap:32px}}
@media (max-width:600px){.stats b{font-size:24px}.stats span{font-size:12.5px}.stats div{padding:12px 10px}}
.feature+.feature{margin-top:110px}
.feature>*{min-width:0}
.feature.flip .shot{order:2}
.feature .shot{display:flex;justify-content:center}
.ticks{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:12px}
.ticks li{display:flex;gap:12px;align-items:flex-start}
.ticks .i{color:var(--hi);margin-top:3px}

/* Swing Check picture, drawn in HTML: two clips side by side with gold lines */
.clips{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(400px,100%)}
.clip{aspect-ratio:9/16;border-radius:20px;background:linear-gradient(180deg,#0D2A55,#041E42);position:relative;overflow:hidden;box-shadow:var(--shadow)}
.clip b{position:absolute;top:14px;left:16px;font-size:13px;color:#fff;letter-spacing:.04em}
.clip svg{position:absolute;inset:0;width:100%;height:100%}
.clip .scrub{position:absolute;left:16px;right:16px;bottom:74px;height:3px;border-radius:2px;background:rgba(255,255,255,.18)}.clip .scrub::after{content:"";position:absolute;left:0;top:0;bottom:0;width:42%;background:var(--gold);border-radius:2px}
.clip .ball{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;left:58%;top:71%}
.clip .play{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center}

.formula{background:var(--navy);color:#fff;border-radius:24px;padding:44px;display:grid;grid-template-columns:1fr 1.2fr;gap:40px;align-items:center}
.formula>*{min-width:0}
.formula .muted{color:var(--on-navy-muted)}
.formula code{font-family:var(--mono);font-size:15px;line-height:1.7;display:block;padding:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#fff}
.factors{display:flex;gap:22px;margin-top:18px;flex-wrap:wrap}
.factors div{display:flex;gap:10px;align-items:center;color:var(--on-navy-muted);font-size:15px}
.factors .i{color:var(--gold)}
.factors b{color:#fff}

.teaser{display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:center;border:1px solid var(--line);border-radius:24px;padding:40px;background:var(--bg);box-shadow:var(--shadow)}
.teaser>*{min-width:0}

.faq{max-width:760px;margin:0 auto}
details{border-bottom:1px solid var(--line);padding:4px 0}
details:first-of-type{border-top:1px solid var(--line)}
summary{cursor:pointer;font-weight:700;font-size:18px;list-style:none;display:flex;justify-content:space-between;gap:16px;padding:18px 0}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:24px;line-height:1;color:var(--gold-ink);font-weight:500;transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details p{margin:0 0 18px;color:var(--muted)}

/* Footer */
footer{border-top:1px solid var(--line);background:var(--paper);padding-block:56px 32px;font-size:15px}
.foot{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:32px}
.foot h4{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.foot a.brand{display:inline-flex}
.foot a{display:block;color:var(--ink);text-decoration:none;padding:3px 0}
.foot a:hover{color:var(--link)}
.foot .brand{color:var(--ink)}
.legal{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

/* Inner pages (privacy, support, coach) */
.pagehead{background:var(--navy);color:#fff;padding-block:56px 48px}
.pagehead h1{font-weight:800;font-size:clamp(36px,6vw,56px);letter-spacing:-.03em;line-height:1.02;margin:10px 0 0}
.pagehead p{color:var(--on-navy-muted);margin:12px 0 0;max-width:60ch}
.doc{max-width:740px;padding-block:56px 80px}
.doc h2{font-size:24px;margin-top:40px}
.doc p,.doc li{max-width:68ch}
.callout{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:16px 18px}
.email{font-family:var(--mono);font-size:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;user-select:all;overflow-wrap:anywhere}

/* Teams page */
.price{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:8px 0 6px}
.price strong{font-size:64px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.card{background:#fff;color:#0B1A33;border-radius:22px;padding:22px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.card .h{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#55657C;margin-bottom:6px}
.card .t{font-weight:800;font-size:17px;margin-bottom:14px}
.cmp{display:grid;grid-template-columns:72px 44px 1fr;gap:10px 12px;align-items:center;font-variant-numeric:tabular-nums}
.cmp .nm{font-weight:700;font-size:15px}
.cmp .v{font-weight:800;font-size:22px;color:#2F7A4A;text-align:right}
.cmp .v.mid{color:#9A6200}
.rb{position:relative;height:22px}
.rb::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#DDE3EC}
.rb i{position:absolute;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:rgba(4,30,66,.18)}
.rb b{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#041E42;box-shadow:0 0 0 2px #fff}
.card .note{font-size:12px;color:#55657C;margin-top:12px}
.pricebox{background:var(--navy);color:#fff;border-radius:24px;padding:44px;display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center}
.pricebox>*{min-width:0}
.pricebox .muted{color:var(--on-navy-muted)}
.pricebox .ticks .i{color:var(--gold)}

/* Scroll reveal (only when JavaScript runs; content is visible without it) */
.js .reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
.js .reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.js .reveal{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}.btn{transition:none}}

@media (max-width:900px){
  .hero .wrap{grid-template-columns:1fr;padding-top:48px;gap:8px}
  .hero-copy{padding-bottom:40px}
  .hero-phone .phone{margin-bottom:-160px}
  .hero{padding-bottom:0}
  .after-hero{padding-top:200px!important}
  .feature,.feature.flip{grid-template-columns:1fr;gap:36px}
  .feature.flip .shot{order:0}
  .formula,.teaser,.pricebox{grid-template-columns:1fr;padding:32px}
  .steps{grid-template-columns:1fr}
  .foot{grid-template-columns:1fr 1fr}
  .foot>div:first-child{grid-column:1/-1}
}
@media (max-width:560px){
  .nav a.hide-sm{display:none}
  .nav{gap:0}.nav a{padding:8px}
  .bar .btn{padding:0 12px;font-size:14px}
  .brand .wm{height:24px}
  section.s{padding-block:72px}
}

.dash{padding-block:28px 72px}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:24px;margin-bottom:20px;box-shadow:var(--shadow)}
.panel h2{font-size:24px;margin:0 0 6px}.panel h3{margin:0 0 10px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input,.field select,.search{width:100%;min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:0 14px}
.field input:focus,.field select:focus,.search:focus{outline:2px solid var(--gold);border-color:transparent}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
.tabs button{font:inherit;font-weight:700;font-size:16px;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:12px 14px;cursor:pointer;min-height:48px;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tabs .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:800;background:var(--panel);color:var(--muted)}
.pill.on{background:rgba(47,122,74,.12);color:var(--hi)}.pagehead .pill.on{background:rgba(124,203,151,.16);color:#9FE0B5}.pill.wait{background:rgba(201,164,76,.16);color:var(--gold-ink)}
.code{font-family:var(--mono);font-size:34px;letter-spacing:.18em;font-weight:500}
.err{color:var(--lo);font-weight:700}.ok{color:var(--hi);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);min-width:0}
.tile .lbl{font-size:13px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center}
.tile .lbl .i{color:var(--gold-ink)}
.tile .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:8px;font-variant-numeric:tabular-nums}
.tile .big small{font-size:18px;font-weight:700;color:var(--muted);letter-spacing:0}
.tile .sub{font-size:14px;color:var(--muted);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:700;font-size:15px;min-height:40px;padding:0 16px;border-radius:999px;border:2px solid transparent;background:var(--panel);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--bg);border-color:var(--ink);color:var(--ink);box-shadow:0 1px 3px rgba(4,30,66,.14)}
.pickers{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin:4px 0 22px}
.pickers .lab{font-size:13px;font-weight:700;color:var(--muted);margin-right:4px}
.chart{display:grid;grid-template-columns:minmax(90px,170px) 64px 1fr;gap:0;align-items:center;font-variant-numeric:tabular-nums}
.chart .hd{font-size:12px;font-weight:700;color:var(--muted);padding:0 12px 8px 0;border-bottom:1px solid var(--line)}
.chart .c{padding:10px 12px 10px 0;border-bottom:1px solid var(--line);min-width:0}
.chart .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart .v{font-weight:800;font-size:22px;text-align:right}
.chart .pm{color:var(--muted);font-size:15px}
.axis{position:relative;height:18px;font-size:11px;color:var(--muted)}
.axis span{position:absolute;transform:translateX(-50%);top:2px}
.rb{position:relative;height:26px}
.rb::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.rb .gl{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.7}
.rb i{position:absolute;top:50%;height:10px;margin-top:-5px;border-radius:5px;background:rgba(30,64,124,.22)}
.rb b{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--navy);box-shadow:0 0 0 2px var(--bg)}
.rb:hover b{transform:scale(1.15)}
